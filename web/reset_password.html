<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 24px; max-width: 520px; margin: auto; }
      label { display:block; margin-top:12px; }
      input { width:100%; padding:8px; margin-top:6px; box-sizing:border-box }
      button { margin-top:16px; padding:10px 16px; background:#1976d2; color:white; border:none; border-radius:6px }
      .error { color:crimson; }
      .success { color:green; }
    </style>
  </head>
  <body>
    <h2>Set a new password</h2>
    <div id="status">Preparing...</div>

    <div id="form" style="display:none">
      <label>New password
        <input id="password" type="password" placeholder="Enter new password" />
      </label>
      <label>Confirm password
        <input id="confirm" type="password" placeholder="Confirm new password" />
      </label>
      <button id="submit">Save password</button>
      <div id="msg"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/index.min.js"></script>
    <script>
      // This page supports two flows:
      // 1) Server-side: link contains `?token=...` -> POST to `complete-reset` Edge Function.
      // 2) Client-side: link contains `access_token` (or hash) -> use Supabase JS to set session and updateUser.

      // Placeholder values for client-side mode. The CI workflow can inject real values.
      const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
      const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';

      const statusEl = document.getElementById('status');
      const formEl = document.getElementById('form');
      const msgEl = document.getElementById('msg');

      function getQueryParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
      }

      function getHashParam(name) {
        const hash = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
        return new URLSearchParams(hash).get(name);
      }

      (async function init(){
        const token = getQueryParam('token');
        const access_token = getQueryParam('access_token') || getHashParam('access_token');

        if (access_token && !SUPABASE_URL.includes('YOUR_PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR_ANON')) {
          // Client-side flow using Supabase JS
          try {
            const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            await supabase.auth.setSession({ access_token, refresh_token: getQueryParam('refresh_token') || getHashParam('refresh_token') });
            statusEl.textContent = 'Validated reset link. Please enter a new password.';
            formEl.style.display = 'block';

            document.getElementById('submit').addEventListener('click', async () => {
              msgEl.textContent = '';
              const pw = document.getElementById('password').value || '';
              const conf = document.getElementById('confirm').value || '';
              if (pw.length < 6) { msgEl.innerHTML = '<span class="error">Password must be at least 6 characters</span>'; return; }
              if (pw !== conf) { msgEl.innerHTML = '<span class="error">Passwords do not match</span>'; return; }

              msgEl.innerHTML = 'Saving...';
              const { data, error } = await supabase.auth.updateUser({ password: pw });
              if (error) {
                msgEl.innerHTML = '<span class="error">Failed to update password: ' + error.message + '</span>';
                return;
              }
              msgEl.innerHTML = '<span class="success">Password updated. You can now sign in with your new password.</span>';
            });
            return;
          } catch (e) {
            console.warn('Client-side reset failed', e);
          }
        }

        if (token) {
          // Server-side token flow
          statusEl.textContent = 'Validated reset link. Please enter a new password.';
          formEl.style.display = 'block';

          document.getElementById('submit').addEventListener('click', async () => {
            msgEl.textContent = '';
            const pw = document.getElementById('password').value || '';
            const conf = document.getElementById('confirm').value || '';
            if (pw.length < 6) { msgEl.innerHTML = '<span class="error">Password must be at least 6 characters</span>'; return; }
            if (pw !== conf) { msgEl.innerHTML = '<span class="error">Passwords do not match</span>'; return; }

            msgEl.innerHTML = 'Saving...';
            try {
              const functionsHost = (SUPABASE_URL.includes('YOUR_PROJECT') ? SUPABASE_URL : 'https://fhsqvuyzoptmkpapxyfl.supabase.co').replace('.supabase.co', '.functions.supabase.co');
              const candidates = [
                `${functionsHost}/complete-reset`,
                `${SUPABASE_URL.replace('YOUR_PROJECT', 'fhsqvuyzoptmkpapxyfl')}/functions/v1/complete-reset`,
              ];

              let respOk = false;
              for (const u of candidates) {
                try {
                  const res = await fetch(u, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: pw }),
                  });
                  const j = await res.json().catch(() => ({}));
                  if (res.ok && j && j.ok) { respOk = true; break; }
                  if (j && j.error) { msgEl.innerHTML = '<span class="error">' + (j.error || 'Failed to reset') + '</span>'; break; }
                } catch (e) {
                  console.warn('attempt failed', u, e);
                }
              }

              if (respOk) {
                msgEl.innerHTML = '<span class="success">Password updated. You can now sign in with your new password.</span>';
                statusEl.textContent = 'Done';
                return;
              }

              msgEl.innerHTML = '<span class="error">Failed to update password. Try again or contact support.</span>';
            } catch (err) {
              msgEl.innerHTML = '<span class="error">Unexpected error: ' + err + '</span>';
            }
          });
          return;
        }

        statusEl.innerHTML = '<span class="error">Missing token or access token in URL. Use the link from the password reset email.</span>';
      })();
    </script>
  </body>
</html>
